apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weather-station-http-redirect
  namespace: weather-station
spec:
  parentRefs:
    - name: weather-station-gateway
      sectionName: http
  hostnames:
    - weather-station.skumble.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weather-station-route
  namespace: weather-station
spec:
  parentRefs:
    - name: weather-station-gateway
      sectionName: https
  hostnames:
    - weather-station.skumble.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: weather-station
          namespace: weather-station
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
